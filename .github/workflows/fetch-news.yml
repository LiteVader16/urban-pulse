name: Fetch news

on:
  schedule:
    # Every four hours. Cron on GitHub Actions is UTC and best-effort — runs on
    # a busy runner queue can slip by several minutes, which does not matter for
    # a news archive that keeps 45 days.
    - cron: "17 */4 * * *"
  workflow_dispatch:        # lets you refresh on demand from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/**"        # re-run whenever the classifier or feed list changes
      - ".github/workflows/fetch-news.yml"

# Only the commit permission is needed; nothing here touches anything else.
permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No pip install step: the fetcher is deliberately stdlib-only, so there
      # is no dependency that can break this workflow on someone else's release.

      - name: Fetch and classify
        run: python3 scripts/fetch_news.py

      - name: Commit if the archive changed
        run: |
          git config user.name  "urban-pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/news.json; then
            echo "No change to the archive; nothing to commit."
            exit 0
          fi
          COUNT=$(python3 -c "import json;print(len(json.load(open('data/news.json'))['articles']))")
          git add data/news.json
          git commit -m "news: refresh archive (${COUNT} stories)"
          # A scheduled run can race a push; rebase rather than fail the job.
          git pull --rebase --autostash origin main
          git push
